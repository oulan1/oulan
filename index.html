  <!-- Запрет жесткого кэширования html страницы -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <style>
    :root {
      --text: #ffffff;
      --muted: #8e8e93;
      --radius: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    html, body {
      height: 100%;
      background: #000000 !important;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow: hidden;
    }

    /* Едва заметный аккуратный индикатор загрузки сверху */
    #top-loader {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #7c11cc, #c084fc);
      box-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
      z-index: 9999;
      transition: width 0.3s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    #glass-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 140px));
      grid-template-rows: auto repeat(5, 90px);
      gap: 12px;
      justify-content: center;
      align-content: center;
      padding: 20px;
      background: #000000;
    }

    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: #000000;
    }

    .header {
      grid-column: 1 / -1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      color: var(--muted);
      height: 26px;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: #a855f7;
      margin-left: 2px;
      border-radius: 2px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0.1; } }

    .mode-toggle {
      position: absolute !important;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50% !important;
      clip-path: circle(50% at 50% 50%) !important;
      z-index: 100;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      outline: none !important;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mode-toggle:active { transform: scale(0.92); }

    .mode-toggle svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      fill: none;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
    }

    .glass-card {
      position: relative;
      border-radius: var(--radius) !important;
      clip-path: inset(0 round var(--radius)) !important;
      isolation: isolate;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 10;
      overflow: hidden !important;
    }

    .glass-card:hover { transform: scale(1.04); z-index: 15; }
    .glass-card:active { transform: scale(0.97); }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) brightness(0.92) contrast(1.1);
      -webkit-backdrop-filter: blur(24px) brightness(0.92) contrast(1.1);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 2;
    }

    .glass-card.matte-active::before { opacity: 1; }

    .card-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: brightness(0.65);
      transition: opacity 0.35s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 3;
      transform-origin: center center;
    }

    .glass-card:hover .card-photo,
    .glass-card:active .card-photo,
    .glass-card.active .card-photo {
      opacity: 1;
      transform: scale(1.08);
    }

    .card-icon {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 4;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .card-icon img { object-fit: contain; }

    .glass-card:hover .card-icon,
    .glass-card:active .card-icon,
    .glass-card.active .card-icon {
      left: 10px;
      top: 10px;
      transform: translateX(0);
      background: rgba(255, 255, 255, 0.14);
    }

    .card-label {
      position: absolute;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      font-weight: 600;
      font-size: 13px;
      color: #ffffff !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      letter-spacing: 0.2px;
      z-index: 4;
      white-space: nowrap;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .glass-card:hover .card-label,
    .glass-card:active .card-label,
    .glass-card.active .card-label {
      left: calc(100% - 10px);
      bottom: 10px;
      transform: translateX(-100%);
    }

    .tg-channel .card-icon { top: 48px; }
    .tg-channel .card-label { bottom: 45px; }

    .tg-channel   { grid-column: 1 / 3; grid-row: 2 / 4; }
    .tg-dm        { grid-column: 3 / 4; grid-row: 2 / 3; }
    .github       { grid-column: 3 / 4; grid-row: 3 / 4; }
    .vk           { grid-column: 1 / 2; grid-row: 4 / 5; }
    .steam        { grid-column: 2 / 4; grid-row: 4 / 5; }
    .discord      { grid-column: 1 / 3; grid-row: 5 / 6; }
    .tiktok       { grid-column: 3 / 4; grid-row: 5 / 6; }
    .donate       { grid-column: 1 / 2; grid-row: 6 / 7; }
    .achievements { grid-column: 2 / 3; grid-row: 6 / 7; }
    .music        { grid-column: 3 / 4; grid-row: 6 / 7; }

    @media (max-width: 520px) {
      #glass-root {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: auto repeat(5, 76px);
        gap: 8px;
        padding: 14px;
      }
      .card-icon { width: 22px; height: 22px; top: 14px; }
      .card-icon img { width: 14px !important; height: 14px !important; }
      .card-label { font-size: 11px; bottom: 10px; }
      .tg-channel .card-icon { top: 40px; }
      .tg-channel .card-label { bottom: 38px; }
      .glass-card:hover .card-icon,
      .glass-card:active .card-icon,
      .glass-card.active .card-icon { left: 6px; top: 6px; }
      .glass-card:hover .card-label,
      .glass-card:active .card-label,
      .glass-card.active .card-label { left: calc(100% - 6px); bottom: 6px; }
      .header { font-size: 14px; height: 22px; margin-bottom: 4px; }
      .mode-toggle { top: 14px; right: 14px; width: 38px; height: 38px; }
    }
  </style>
</head>

  <script type="module">
    // 0. АВТО-ОБНОВЛЕНИЕ САЙТА: проверяем новую версию без F5
    (async function checkAutoUpdate() {
      if (location.protocol === 'file:') return;
      try {
        const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        const etag = res.headers.get('etag') || res.headers.get('last-modified');
        if (etag) {
          const savedEtag = localStorage.getItem('site_etag_version');
          if (savedEtag && savedEtag !== etag) {
            localStorage.setItem('site_etag_version', etag);
            window.location.reload(true);
            return;
          }
          localStorage.setItem('site_etag_version', etag);
        }
      } catch (_) {}
    })();

    import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

    // 1. Анимация Canvas-фона
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const lights = [
      { x: 0.35, y: 0.3, r: 240, col: 'rgba(147, 51, 234, 0.25)', spd: 0.0006, phX: 1.1, phY: 2.3 },
      { x: 0.65, y: 0.7, r: 280, col: 'rgba(126, 34, 206, 0.20)', spd: 0.0005, phX: 3.4, phY: 0.8 },
      { x: 0.5,  y: 0.5, r: 200, col: 'rgba(168, 85, 247, 0.16)', spd: 0.0008, phX: 0.5, phY: 4.1 }
    ];

    let glassInstance = null;

    function renderScene(t) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const l of lights) {
        const cx = canvas.width * l.x + Math.sin(t * l.spd + l.phX) * 110 + Math.cos(t * l.spd * 0.4) * 40;
        const cy = canvas.height * l.y + Math.cos(t * l.spd * 0.8 + l.phY) * 90 + Math.sin(t * l.spd * 0.3) * 35;

        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, l.r);
        g.addColorStop(0, l.col);
        g.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, l.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (glassInstance && typeof glassInstance.markChanged === 'function') {
        glassInstance.markChanged(canvas);
      }
      requestAnimationFrame(renderScene);
    }
    requestAnimationFrame(renderScene);

    // 2. LiquidGlass инициализация
    const baseConfig = {
      refraction: 1,
      chromAberration: 0.015,
      edgeHighlight: 0,
      specular: 0,
      fresnel: 2,
      distortion: 0,
      cornerRadius: 12,
      zRadius: 24,
      opacity: 1,
      saturation: -0.3,
      brightness: -0.05,
      shadowOpacity: 0,
      shadowSpread: 0,
      bevelMode: 0,
      blurAmount: 0
    };

    const root = document.getElementById('glass-root');
    const allCards = document.querySelectorAll('.glass-card');

    allCards.forEach(card => {
      const cfg = { ...baseConfig };
      if (card.classList.contains('mode-toggle')) {
        cfg.cornerRadius = 22;
        cfg.zRadius = 22;
      }
      card.dataset.config = JSON.stringify(cfg);
    });

    glassInstance = await LiquidGlass.init({
      root: root,
      glassElements: allCards
    });

    // 3. Переключатель матовости
    let isFrosted = false;
    const modeBtn = document.getElementById('modeToggle');

    modeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isFrosted = !isFrosted;
      const targetBlur = isFrosted ? 1.0 : 0.0;

      allCards.forEach(card => {
        card.classList.toggle('matte-active', isFrosted);
        try {
          const cfg = JSON.parse(card.dataset.config || '{}');
          cfg.blurAmount = targetBlur;
          card.dataset.config = JSON.stringify(cfg);
        } catch (_) {}
      });

      if (glassInstance && typeof glassInstance.markChanged === 'function') {
        glassInstance.markChanged();
      }
    });

    // 4. Умный прогресс-бар и фоновый кэш всех картинок (мгновенное открытие без лагов)
    const loaderBar = document.getElementById('top-loader');
    const photoDoms = document.querySelectorAll('.card-photo');
    const totalPhotos = photoDoms.length;
    let loadedCount = 0;

    loaderBar.style.width = '20%';

    photoDoms.forEach(photoEl => {
      const src = photoEl.dataset.src;
      if (!src) return;

      const img = new Image();
      img.src = src;

      const onLoaded = () => {
        // Проставляем фон сразу в DOM — картинка уже в памяти и кэше
        photoEl.style.backgroundImage = `url('${src}')`;
        loadedCount++;
        const percent = Math.round(20 + (loadedCount / totalPhotos) * 80);
        loaderBar.style.width = percent + '%';

        if (loadedCount >= totalPhotos) {
          setTimeout(() => {
            loaderBar.style.opacity = '0';
            setTimeout(() => loaderBar.remove(), 500);
          }, 200);
        }
      };

      if (img.complete) {
        onLoaded();
      } else {
        img.onload = onLoaded;
        img.onerror = onLoaded;
      }
    });

    // Мобильный тап
    allCards.forEach(card => {
      card.addEventListener('pointerdown', () => {
        allCards.forEach(c => c !== card && c.classList.remove('active'));
        card.classList.toggle('active');
      });
    });
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.glass-card')) {
        allCards.forEach(c => c.classList.remove('active'));
      }
    });

    // 5. Плавная печать в названии вкладки
    (function(){
      const targetChars = ['o', 'u', 'l', 'a', 'n'];
      function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

      async function runTitleTyping() {
        const invisiblePad = '\u200E';

        while (true) {
          document.title = '|';
          await wait(180);
          document.title = invisiblePad + ' ';
          await wait(180);
          document.title = '|';
          await wait(180);

          let current = '';
          for (let i = 0; i < targetChars.length; i++) {
            const char = targetChars[i];

            document.title = current + char + '|';
            await wait(110);

            document.title = current + char;
            await wait(70);

            current += char + ' ';
            document.title = current + '|';
            await wait(110);
          }

          await wait(600);
          document.title = current.trimEnd();
          await wait(300);
          document.title = current + '|';
          await wait(350);
          document.title = current.trimEnd();
          await wait(300);
          document.title = current + '|';
          await wait(800);

          while (current.length > 0) {
            current = current.slice(0, -1);
            document.title = (current || invisiblePad) + '|';
            await wait(45);
          }
          document.title = '|';
          await wait(220);
          document.title = invisiblePad + ' ';
          await wait(220);
        }
      }
      runTitleTyping();
    })();

    // 6. Подключение Firebase Realtime Database
    const texts = [
      "Site views: ...",
      "Hello World!",
      "oulan - Beginner developer"
    ];

    const FIREBASE_URL = 'https://oulan-bd52d-default-rtdb.europe-west1.firebasedatabase.app/views.json';

    async function initFirebaseViews() {
      const isLocal = location.hostname === 'localhost' || 
                      location.hostname === '127.0.0.1' || 
                      location.protocol === 'file:';
      const hasViewed = sessionStorage.getItem('oulan_fb_viewed');

      try {
        const res = await fetch(FIREBASE_URL);
        let count = await res.json();
        if (typeof count !== 'number') count = 0;

        if (!isLocal && !hasViewed) {
          count += 1;
          await fetch(FIREBASE_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(count)
          });
          sessionStorage.setItem('oulan_fb_viewed', 'true');
        }

        texts[0] = `Site views: ${count}`;
      } catch (e) {
        console.warn("Firebase notice:", e);
        texts[0] = "Site views: 1";
      }
    }

    // 7. Строка статуса
    const el = document.getElementById('typebox');
    let ti = 0, pos = 0, deleting = false;
    const speed = 130, delSpeed = 80, pause = 1200;

    function step() {
      const cur = texts[ti % texts.length];

      if (!deleting) {
        el.textContent = cur.slice(0, pos + 1);
        pos++;
        if (pos >= cur.length) {
          deleting = true;
          setTimeout(step, pause);
          return;
        }
        setTimeout(step, speed);
      } else {
        el.textContent = cur.slice(0, pos - 1);
        pos--;
        if (pos <= 0) {
          deleting = false;
          ti++;
          setTimeout(step, 400);
          return;
        }
        setTimeout(step, delSpeed);
      }
    }

    (async () => {
      await initFirebaseViews();
      step();
    })();
  </script>
</body>
</html>
